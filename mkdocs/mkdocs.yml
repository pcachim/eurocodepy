site_name: Documentation for EurocodePy

theme:
  name: "material"

plugins:
  - search  
  - gen-files:
      scripts:
      - scripts/gen_ref_pages.py
      - scripts/gen_clause_map.py
      - scripts/gen_index.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index:
  - mkdocstrings

nav:
  - index.md
  - tutorials.md
  - how-to-guides.md
  - explanation.md
  - Modules: 
    - EC1: modules/ec1.md 
    - EC2:
      - modules/ec2/index.md
      - modules/ec2/edition-2004.md
      - modules/ec2/edition-2023.md
      - modules/ec2/shells.md
      - modules/ec2/clauses.md
    - Editions and National Annexes: modules/editions.md
    - EC3: modules/ec3.md 
    - EC5: modules/ec5.md 
    - EC7: modules/ec7.md 
    - EC8: modules/ec8.md 
    - Utils: modules/utils.md 
  - Code Reference: reference/
  - Copyright & contributing:
    - copyright.md
    - STYLE_GUIDE.md
    - CODE_OF_CONDUCT.md
markdown_extensions:
  - admonition
