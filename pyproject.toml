
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eurocodepy"
version = "2027.0.8"
authors = [
    { name="Paulo Cachim", email="pcachim@ua.pt" },
]
description = "A package for eurocode calculations"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.2.3",
    "plotly>=6.1.2",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
    "mkdocstrings>=0.29.1",
    "mkdocstrings-python>=1.16.12",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-section-index>=0.3.10",
    "seaborn>=0.13.2",
    "marimo>=0.20.4",
    "pyzmq>=27.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11.13",
    "ty>=0.0.1a10",
    "pre-commit>=4.2.0",
    "pytest>=8.0",
    "jsonschema>=4.23.0",
]
test = [
    "pytest>=8.0",
    "jsonschema>=4.23.0",
]

[project.urls]
"Homepage" = "https://github.com/pcachim/eurocodepy"
"Bug Tracker" = "https://github.com/pcachim/eurocodepy/issues"


[tool.setuptools.package-data]
# Glob-based, so a new data file (a new JSON/CSV/XLSX under data/) is picked
# up automatically -- unlike the old MANIFEST.in, which listed each file by
# name and had already silently dropped eurocode_data_portugal.json from the
# sdist because nobody remembered to add it. See dev/dbase_versioning.md
# problem 5 / phase 6 (xdfem2d repository).
eurocodepy = ["data/*.json", "data/*.csv", "data/*.xlsx"]

[tool.ruff]
line-length = 88
target-version = "py311"
lint.select = ["ALL"]
lint.ignore = ["D100"]       # check available rules by: uv run ruff rules
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
